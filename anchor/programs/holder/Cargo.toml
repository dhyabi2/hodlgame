[package]
name = "holder"
version = "0.1.0"
description = "Holder game — stake to earn rebates from seller taxes"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "holder"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["metadata"] }
